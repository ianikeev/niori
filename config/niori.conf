;; Niori configuration - a single property list.
;; Only the keys present here override the built-in defaults.
;; Directory values must end with a path separator (/).

(:port 8080
 :host "127.0.0.1"
 :auto-open t
 :data-directory "data/"
 :database-file "niori.db"
 :backup-directory "backups/"
 :backup-on-start nil
 :sync-enabled t
 :sync-interval-seconds 60)
